[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfm-agent"
version = "0.1.0"
description = "Experimental agent: TypeSafe Jev controls a Transformice mouse via typed keyboard decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
observe = [
    "caseus @ git+https://github.com/friedkeenan/caseus",
    "scapy>=2.5",
]
jev = [
    "typesafe-sdk>=0.7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tfm-agent = "tfm_agent.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tfm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.uv]
package = true
